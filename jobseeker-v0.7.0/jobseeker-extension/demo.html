<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>JobSeeker 테스트 지원서</title><style>body{font:16px system-ui;max-width:780px;margin:40px auto;background:#f5f7f5;color:#183e34}fieldset{background:white;border:1px solid #cedbd2;border-radius:12px;margin:20px 0;padding:24px}label{display:block;margin:15px 0}input,select,textarea,button{font:inherit;padding:9px}label input:not([type=radio]),select,textarea{display:block;width:80%}dialog{border:1px solid #abc;border-radius:12px}button{cursor:pointer;margin:8px}#submitted{color:#a22}</style></head><body><h1>지원서 입력 테스트</h1><p>가상 양식입니다. 데모 데이터는 실제 지원서에 사용하지 마세요.</p><form>
<fieldset><legend>기본정보</legend><label>이름<input name="name" required></label><label>이메일<input name="email" type="email"></label><label>휴대전화<input name="phone" type="tel"></label></fieldset>
<fieldset><legend>학력</legend><label>학교명<input id="school" readonly></label><button type="button" id="open-school">학교 검색</button><label>전공<input name="major"></label><label>입학년월<input name="start" type="month"></label><label>졸업년월<input name="end" type="month"></label><label>졸업구분<select name="status"><option value="">선택</option><option>재학</option><option>졸업예정</option><option>졸업</option></select></label></fieldset>
<fieldset><legend>재직구분</legend><label><input type="radio" name="employmentStatus" value="1">재직</label><label><input type="radio" name="employmentStatus" value="2">퇴사</label></fieldset>
<section><h2>활동</h2><label id="category-label">활동구분</label><button type="button" id="category" role="combobox" aria-labelledby="category-label" aria-controls="category-options" aria-expanded="false">선택하세요</button><div id="category-options" role="listbox" hidden><button type="button" role="option">교내활동</button><button type="button" role="option">대외활동</button></div><label>수상일<input name="award-date" type="date"></label></section>
<section id="experience"><h2>경력</h2><button type="button" id="add-experience">경력 추가</button></section>
<button type="submit">최종 제출</button><p id="submitted"></p></form>
<dialog id="school-dialog" aria-label="학교 검색"><h2>학교 검색</h2><label>학교명<input id="school-query" type="search"></label><button type="button" id="school-search">검색</button><div id="school-results"></div><button type="button" id="close-dialog">닫기</button></dialog>
<script src="demo.js"></script></body></html>
