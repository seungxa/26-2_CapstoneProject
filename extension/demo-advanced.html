<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>다양한 지원서 입력 테스트</title><style>body{font:15px system-ui;max-width:900px;margin:30px auto;background:#f5f7f5;color:#173e34}table{width:100%;background:white;border-collapse:collapse}td,th{border:1px solid #ccd8d1;padding:18px;text-align:left}input,select,button{font:inherit;padding:8px}input{width:110px}input[maxlength="2"],input[maxlength="4"]{width:70px}[role=listbox]{border:1px solid #aaa;padding:12px}#base-address{width:300px}</style></head><body><h1>사이트 구조를 읽는 입력 도우미 테스트</h1><p>테스트용 양식입니다. 아래에는 전화번호·생년월일 분할, 라디오, 커스텀 목록, 별도 주소 창이 있습니다.</p><form id="application"><table>
<tr><th>성명</th><td><input id="korean-name"></td><th>한자성명</th><td><input id="hanja-name"></td></tr>
<tr><th>생년월일</th><td id="birth-group"><input id="by" maxlength="4"> 년 <input id="bm" maxlength="2"> 월 <input id="bd" maxlength="2"> 일</td><th>성별</th><td id="gender-group"><label>남<input type="radio" name="gender" value="M"></label><label>여<input type="radio" name="gender" value="F"></label></td></tr>
<tr><th>휴대폰</th><td id="phone-group"><select id="p0"><option>010</option><option>011</option></select> - <input id="p1" maxlength="4"> - <input id="p2" maxlength="4"></td><th>비상연락처</th><td id="emergency-group"><select id="e0"><option>010</option><option>02</option></select> - <input id="e1" maxlength="4"> - <input id="e2" maxlength="4"></td></tr>
<tr><th>성별</th><td><button type="button" id="custom-gender" role="combobox" aria-controls="gender-options">선택</button><div id="gender-options" role="listbox" hidden><div role="option">남성</div><div role="option">여성</div></div></td><th>DOB</th><td id="unknown-birth"><input maxlength="4"><input maxlength="2"><input maxlength="2"></td></tr>
<tr><th>현주소</th><td colspan="3" id="address-group"><input id="zip" readonly><button type="button" id="address-search">주소검색</button><input id="base-address" readonly><input id="detail-address"></td></tr>
</table><button id="next" type="button">다음 단계</button><button id="save" type="button">저장</button><button id="confirm" type="button">확인</button><button id="submit" type="submit">최종 제출</button><p id="trace"></p></form><script src="demo-advanced.js"></script></body></html>
